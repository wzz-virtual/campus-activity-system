<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园活动管理系统 V2.0 · 交互 Demo</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e4e7ec;
    --border-strong: #d0d5dd;
    --text: #1d2939;
    --muted: #667085;
    --faint: #98a2b3;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #eff4ff;
    --ok: #079455;
    --ok-soft: #ecfdf3;
    --warn: #b54708;
    --warn-soft: #fffaeb;
    --danger: #d92d20;
    --danger-soft: #fef3f2;
    --purple: #6938ef;
    --purple-soft: #f4f3ff;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* ---------- 通用 ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--text); font-weight: 500;
    transition: .14s; white-space: nowrap;
  }
  .btn:hover { background: #f9fafb; border-color: #b9c0cb; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn.warn { background: #fff; border-color: #fdb022; color: var(--warn); }
  .btn.warn:hover { background: var(--warn-soft); }
  .btn.danger { background: #fff; border-color: #fda29b; color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: #eef1f5; color: var(--text); }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:disabled:hover { background: #fff; border-color: var(--border-strong); }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap;
  }
  .st-draft     { background: #f2f4f7; color: #475467; }
  .st-pending   { background: var(--warn-soft); color: var(--warn); }
  .st-rejected  { background: var(--danger-soft); color: var(--danger); }
  .st-published { background: var(--primary-soft); color: var(--primary-dark); }
  .st-ongoing   { background: var(--ok-soft); color: var(--ok); }
  .st-finished  { background: #eef2f6; color: #475467; }
  .st-canceled  { background: #f2f4f7; color: var(--faint); }
  .st-offline   { background: var(--danger-soft); color: var(--danger); }
  .st-waitlist  { background: var(--warn-soft); color: var(--warn); }
  .role-STUDENT { background: #eef2f6; color: #475467; }
  .role-TEACHER { background: var(--purple-soft); color: var(--purple); }
  .role-ADMIN   { background: var(--primary-soft); color: var(--primary-dark); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 20px; }

  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .small { font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .spacer { flex: 1; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .ok-mark { color: var(--ok); font-weight: 600; }
  .full-mark { color: var(--warn); font-weight: 600; }

  /* ---------- 登录页 ---------- */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px; background: linear-gradient(160deg, #f7f9fc 0%, #eef2f9 100%);
  }
  .login-box { width: 100%; max-width: 880px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; }
  .login-left h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.4px; }
  .login-left .sub { color: var(--muted); margin-bottom: 24px; }
  .role-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 16px; margin-bottom: 12px; text-align: left;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); transition: .16s;
  }
  .role-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,.12); }
  .role-ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; flex: none; }
  .role-card .rc-t { font-weight: 600; }
  .role-card .rc-d { color: var(--muted); font-size: 12.5px; }
  .guide-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
  .guide-box h3 { margin: 0 0 4px; font-size: 14px; }
  .guide-list { margin: 12px 0 0; padding: 0; list-style: none; counter-reset: g; }
  .guide-list li {
    counter-increment: g; position: relative; padding-left: 26px;
    margin-bottom: 10px; font-size: 13px; color: #475467;
  }
  .guide-list li::before {
    content: counter(g); position: absolute; left: 0; top: 1px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--primary-soft);
    color: var(--primary-dark); font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }

  /* ---------- 顶栏 / 布局 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40; height: 58px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
  .brand .logo { font-size: 18px; }
  .tag { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--purple-soft); color: var(--purple); }
  .userbox { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--border); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft);
    color: var(--primary-dark); display: grid; place-items: center; font-weight: 600; font-size: 13px;
  }
  .layout { display: flex; align-items: flex-start; min-height: calc(100vh - 58px); }
  .sidebar {
    width: 196px; flex: none; padding: 16px 12px; position: sticky; top: 58px;
    height: calc(100vh - 58px); overflow-y: auto; border-right: 1px solid var(--border); background: #fff;
  }
  .nav {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 8px;
    color: #475467; font-weight: 500; margin-bottom: 3px; cursor: pointer; transition: .12s;
  }
  .nav:hover { background: #f4f6f9; color: var(--text); }
  .nav.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
  .content { flex: 1; min-width: 0; padding: 22px 24px 60px; }

  .page-head { margin-bottom: 18px; }
  .page-head h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: -.2px; }
  .page-head p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ---------- 活动卡片 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search {
    flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border-strong); background: #fff; outline: none;
  }
  .search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  select.sel { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .chip {
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; color: var(--muted); font-size: 13px; transition: .12s;
  }
  .chip:hover { border-color: var(--border-strong); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 16px; }
  .acard {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: .16s; cursor: pointer;
  }
  .acard:hover { border-color: #c7d2fe; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(16,24,40,.1); }
  .acover { height: 96px; display: grid; place-items: center; font-size: 36px; position: relative; }
  .acover .st-badge { position: absolute; top: 9px; right: 9px; }
  .t-blue   { background: linear-gradient(135deg, #dbeafe, #eff6ff); }
  .t-purple { background: linear-gradient(135deg, #e9e3ff, #f5f3ff); }
  .t-green  { background: linear-gradient(135deg, #d1fadf, #ecfdf3); }
  .t-orange { background: linear-gradient(135deg, #fedf89, #fffaeb); }
  .t-pink   { background: linear-gradient(135deg, #fce7f3, #fdf2f8); }
  .t-teal   { background: linear-gradient(135deg, #cffafe, #ecfeff); }
  .abody { padding: 13px 14px 14px; display: flex; flex-direction: column; flex: 1; }
  .atitle { font-weight: 600; font-size: 14.5px; margin-bottom: 6px; line-height: 1.4; }
  .ameta { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .afoot { margin-top: auto; padding-top: 11px; display: flex; align-items: center; gap: 8px; }
  .progress { height: 5px; border-radius: 3px; background: #eef1f5; overflow: hidden; margin-top: 9px; }
  .progress > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
  .progress.warn > i { background: #f79009; }
  .progress.full > i { background: var(--danger); }

  .empty { padding: 56px 20px; text-align: center; color: var(--faint); }
  .empty .ei { font-size: 34px; margin-bottom: 8px; }

  /* ---------- 表格 ---------- */
  table.tb { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tb th {
    text-align: left; padding: 10px 12px; background: var(--panel-2);
    color: var(--muted); font-weight: 500; font-size: 12.5px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.tb td { padding: 11px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
  table.tb tr:last-child td { border-bottom: none; }
  table.tb tbody tr:hover { background: #fbfcfd; }
  .tbl-wrap { overflow-x: auto; border-radius: var(--radius); }

  /* ---------- 详情页 ---------- */
  .detail-hero { border-radius: var(--radius); padding: 26px; display: flex; gap: 20px; align-items: center; margin-bottom: 18px; }
  .detail-hero .dh-ico { font-size: 46px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 12px; font-size: 13.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .side-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .big-num { font-size: 25px; font-weight: 650; letter-spacing: -.5px; }

  /* ---------- 表单 ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 500; color: #344054; }
  .field label .req { color: var(--danger); }
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field select, .field textarea {
    padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; outline: none; width: 100%;
  }
  .field textarea { min-height: 86px; resize: vertical; line-height: 1.6; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .check-field { display: flex; align-items: flex-start; gap: 9px; }
  .check-field input { margin-top: 3px; }
  .hint { font-size: 12px; color: var(--faint); }
  .err-box {
    background: var(--danger-soft); border: 1px solid #fda29b; color: var(--danger);
    padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }

  /* ---------- 提示 / 弹窗 ---------- */
  #toast-wrap { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    padding: 10px 18px; border-radius: 9px; background: #1d2939; color: #fff;
    font-size: 13.5px; box-shadow: 0 8px 24px rgba(16,24,40,.2);
    opacity: 0; transform: translateY(-10px); transition: .22s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { background: #054f31; }
  .toast.err { background: #912018; }
  .toast.warn { background: #7a2e0e; }

  .mask { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 150; display: grid; place-items: center; padding: 20px; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(16,24,40,.24); overflow: hidden; }
  .modal-h { padding: 18px 20px 0; font-weight: 600; font-size: 15.5px; }
  .modal-b { padding: 12px 20px 20px; }
  .modal-f { padding: 14px 20px; background: var(--panel-2); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 9px; }
  .modal textarea { width: 100%; min-height: 84px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); outline: none; resize: vertical; }
  .modal textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

  /* ---------- 统计 ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .stat .sl { font-size: 12.5px; color: var(--muted); }
  .stat .sv { font-size: 24px; font-weight: 650; letter-spacing: -.5px; margin-top: 2px; }
  .stat .sd { font-size: 12px; color: var(--faint); }

  .callout {
    border-left: 3px solid var(--primary); background: var(--primary-soft);
    padding: 12px 15px; border-radius: 0 8px 8px 0; font-size: 13px; color: #1e3a8a;
  }
  .callout.warn { border-color: #f79009; background: var(--warn-soft); color: #7a2e0e; }
  .callout.danger { border-color: #fda29b; background: var(--danger-soft); color: #912018; }

  .code-chip {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #1d2939; color: #fff; padding: 6px 14px; border-radius: 8px;
    font-size: 19px; letter-spacing: 5px; font-weight: 600;
  }

  @media (max-width: 900px) {
    .login-box { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .sidebar { width: 60px; padding: 12px 6px; }
    .nav { justify-content: center; padding: 9px 0; }
    .nav .nl { display: none; }
    .content { padding: 16px 14px 50px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-wrap"></div>
<div id="modal-root"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 工具函数
     ========================================================= */
  const NOW = new Date();
  const H = (h) => new Date(NOW.getTime() + h * 3600000);
  const iso = (d) => d.toISOString();
  const pad = (n) => String(n).padStart(2, '0');

  function fmt(t) {
    const d = new Date(t);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtShort(t) {
    const d = new Date(t);
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function untilText(t) {
    const ms = new Date(t).getTime() - Date.now();
    if (ms <= 0) return '已截止';
    const h = Math.floor(ms / 3600000);
    if (h >= 24) return '还剩 ' + Math.floor(h / 24) + ' 天';
    if (h >= 1) return '还剩 ' + h + ' 小时';
    return '还剩 ' + Math.max(1, Math.floor(ms / 60000)) + ' 分钟';
  }
  function toLocalInput(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

  /* ---------- 两套状态词表（V2.0） ---------- */

  // 活动：六态。V2.0 去掉了活动审核流（没有「待审核 / 已驳回」），
  // 管理员对违规活动的处理改为「下线 / 恢复」。
  const STATUS = {
    DRAFT:     { label: '草稿',   cls: 'st-draft' },
    PUBLISHED: { label: '已发布', cls: 'st-published' },
    ONGOING:   { label: '进行中', cls: 'st-ongoing' },
    FINISHED:  { label: '已结束', cls: 'st-finished' },
    OFFLINE:   { label: '已下线', cls: 'st-offline' },
    CANCELED:  { label: '已取消', cls: 'st-canceled' }
  };
  // 报名：五态。V2.0 的核心——满员不再是"报不上"，而是进候补队列。
  const ENROLL = {
    PENDING:    { label: '待审核', cls: 'st-pending' },
    CONFIRMED:  { label: '正式',   cls: 'st-ongoing' },
    WAITLISTED: { label: '候补',   cls: 'st-waitlist' },
    REJECTED:   { label: '已拒绝', cls: 'st-rejected' },
    CANCELED:   { label: '已取消', cls: 'st-canceled' }
  };
  const ROLE_LABEL = { STUDENT: '学生', TEACHER: '活动组织教师', ADMIN: '系统管理员' };

  const VISIBLE_TO_STUDENT = ['PUBLISHED', 'ONGOING', 'FINISHED', 'CANCELED'];
  const ADMIN_OFFINABLE = ['PUBLISHED', 'ONGOING', 'FINISHED'];
  const ACTIVE_ENROLL = ['PENDING', 'CONFIRMED', 'WAITLISTED'];

  function badge(st) {
    const m = STATUS[st] || { label: st, cls: 'st-draft' };
    return '<span class="badge ' + m.cls + '">' + m.label + '</span>';
  }
  function enrollBadge(st, extra) {
    const m = ENROLL[st] || { label: st, cls: 'st-draft' };
    return '<span class="badge ' + m.cls + '">' + m.label + (extra || '') + '</span>';
  }
  function roleBadge(r) {
    return '<span class="badge role-' + r + '">' + ROLE_LABEL[r] + '</span>';
  }
  function toneOf(id) { return ['blue', 'purple', 'green', 'orange', 'pink', 'teal'][id % 6]; }

  /* 取消报名策略：距报名截止不足这个小时数起，名单锁定，不可再取消。
     ⚠️ 只作用于「正式」报名；「候补退出」「待审核撤销」随时可用。 */
  const CANCEL_LOCK_HOURS = 24;

  /** 按时间推导活动应当处于的状态（恢复下线时用）。 */
  function statusByTime(a) {
    const now = Date.now();
    if (now < new Date(a.startTime).getTime()) return 'PUBLISHED';
    if (now < new Date(a.endTime).getTime()) return 'ONGOING';
    return 'FINISHED';
  }

  /* =========================================================
     2. 模拟数据
     ========================================================= */
  const CATEGORIES = [
    { id: 1, name: '文艺演出' },
    { id: 2, name: '体育竞技' },
    { id: 3, name: '学术讲座' },
    { id: 4, name: '志愿服务' },
    { id: 5, name: '社团活动' }
  ];

  const ALL_USERS = [
    { id: 1,  studentNo: '20230101', name: '李明', role: 'STUDENT', email: '20230101@campus.edu.cn', status: 1 },
    { id: 2,  studentNo: '20230102', name: '王芳', role: 'STUDENT', email: '20230102@campus.edu.cn', status: 1 },
    { id: 3,  studentNo: '20230103', name: '赵启', role: 'STUDENT', email: '20230103@campus.edu.cn', status: 1 },

  /* ---------- 预置的报名记录 ----------
     一条报名记录 = 某人对某个活动的一次参与。V2.0 里它有五种状态；
     候补队列由「状态为候补的记录按进入候补时间排序」构成。 */

  const MY_SEED = [
    // 五种状态同屏（李明 20230101）
    { activityId: 1,  status: 'CONFIRMED',  enrolledAt: H(-200), checkInAt: null },     // 进行中·待签到

    { activityId: 5,  status: 'WAITLISTED', enrolledAt: H(-33),  waitlistedAt: H(-33) },// 满员 → 候补中（第 2 位）
    { activityId: 6,  status: 'CONFIRMED',  enrolledAt: H(-300), checkInAt: H(-70) },   // 已签到
    { activityId: 9,  status: 'PENDING',    enrolledAt: H(-20) },                       // 待审核（教师端可处理）

    { activityId: 3,  status: 'REJECTED',   enrolledAt: H(-90),  reviewedAt: H(-60) },  // 已拒绝（可重新报名）
    { activityId: 8,  status: 'CANCELED',   enrolledAt: H(-90),  canceledAt: H(-60) }   // 已取消（在截止前退出，现已不能重报）
  ];

  // 某个活动的候补队列 / 待审核申请（除「我」之外的其他人）
  const OTHER_ENROLL_SEED = {
    // 满员活动：候补队列按进入候补的时间先到先得
    5:  { waitlist: [['20230102', -55], ['20230104', -12]] },   // 爬山：王芳第 1、孙悦第 3（我在中间排第 2）
    14: { waitlist: [['20230102', -60], ['20230103', -45]] },   // 夜跑：王芳、赵启在后面等（我占着正式名额）
    15: { pending:  [['20230106', 0], ['20230107', 0]] },       // 暗房进阶：吴桐、郑楠 的申请（满员，通过也只能进候补）
    9:  { pending:  [['20230102', 0], ['20230103', 0], ['20230104', 0]] }, // 人像：王芳、赵启、孙悦（再加上"我"）
    3:  { pending:  [['20230106', 0]] }                          // 篮球赛：吴桐的申请（审核教师是林老师）
  };

  function makeEnrollments(activities) {
    const list = [];
    const push = (activityId, person, status, extra) => {
      list.push(Object.assign({
        id: list.length + 1,
        activityId: activityId,
        userId: person.id,
        studentNo: person.studentNo,
        name: person.name,
        isMe: person.id === LOGIN_USERS.STUDENT.id,
        status: status,
        enrolledAt: iso(H(-40)),
        waitlistedAt: null,
        reviewedAt: null,
        reviewedBy: null,
        canceledAt: null,
        checkInAt: null
      }, extra || {}));
    };

    activities.forEach((a) => {
      const mineConfirmed = MY_SEED.some((m) => m.activityId === a.id && m.status === 'CONFIRMED');
      const mineCheckedOnIt = MY_SEED.some((m) => m.activityId === a.id && m.checkInAt);
      const total = a.seedEnrolled - (mineConfirmed ? 1 : 0);
      const checkedMocks = Math.max((a.seedChecked || 0) - (mineCheckedOnIt ? 1 : 0), 0);
      for (let i = 0; i < total; i++) {
        const s = mockStudent(a.id * 131 + i);
        push(a.id, s, 'CONFIRMED', {
          enrolledAt: iso(new Date(new Date(a.createdAt).getTime() + (i + 1) * 1500000)),
          checkInAt: i < checkedMocks ? iso(new Date(a.startTime)) : null
        });
      }
      // 其他人预置的候补 / 待审核
      const seeds = OTHER_ENROLL_SEED[a.id];
      if (seeds) {
        (seeds.waitlist || []).forEach((item) => {
          push(a.id, byNo(item[0]), 'WAITLISTED', {
            enrolledAt: iso(H(item[1] - 1)),
            waitlistedAt: iso(H(item[1]))
          });
        });
        (seeds.pending || []).forEach((item) => {
          push(a.id, byNo(item[0]), 'PENDING', { enrolledAt: iso(H(-18)) });
        });
      }
    });

    // 「我」的报名
    MY_SEED.forEach((m) => push(m.activityId, LOGIN_USERS.STUDENT, m.status, {
      enrolledAt: iso(m.enrolledAt),
      waitlistedAt: m.waitlistedAt ? iso(m.waitlistedAt) : null,
      reviewedAt: m.reviewedAt ? iso(m.reviewedAt) : null,
      canceledAt: m.canceledAt ? iso(m.canceledAt) : null,
      checkInAt: m.checkInAt ? iso(m.checkInAt) : null
    }));

    return list;
  }

  /* =========================================================
     4. 数据访问与业务规则
     ========================================================= */
  const getAct = (id) => state.activities.find((a) => a.id === id);
  const catName = (id) => (CATEGORIES.find((c) => c.id === id) || {}).name || '未分类';
  const orgName = (id) => {
    const u = ALL_USERS.find((x) => x.id === id);
    return u ? (u.org || u.name) : '未知';
  };
  const isMineAct = (a) => state.user && a.organizerId === state.user.id;
  const isTeacher = (u) => u && u.role === 'TEACHER';

  const ofActivity = (id) => state.enrollments.filter((e) => e.activityId === id);
  const confirmedOf = (id) => ofActivity(id).filter((e) => e.status === 'CONFIRMED').length;
  const checkedOf = (id) => ofActivity(id).filter((e) => e.status === 'CONFIRMED' && e.checkInAt).length;
  const pendingOf = (id) => ofActivity(id).filter((e) => e.status === 'PENDING');
  const isFull = (a) => confirmedOf(a.id) >= a.capacity;
  const byQueueOrder = (a, b) =>
    (new Date(a.waitlistedAt).getTime() - new Date(b.waitlistedAt).getTime()) || (a.id - b.id);
  const waitlistOf = (id) => ofActivity(id).filter((e) => e.status === 'WAITLISTED').sort(byQueueOrder);
  const myEnroll = (id) => state.enrollments.find((e) => e.activityId === id && e.isMe);
  function waitlistPosition(e) {
    const q = waitlistOf(e.activityId);
    return q.findIndex((x) => x.id === e.id) + 1;
  }

  /** 卡片上的「报名状态标记」：可报名 / 已满员 · 可候补（FR-1.1）。 */
  function enrollLine(a) {
    if (a.status === 'OFFLINE') return '<span class="faint">该活动已下线</span>';
    if (a.status === 'CANCELED') return '<span class="faint">该活动已取消</span>';
    if (a.status === 'FINISHED') return '<span class="faint">该活动已结束</span>';
    if (a.status === 'ONGOING') return '<span class="faint">活动已开始，报名通道已关闭</span>';
    if (Date.now() >= new Date(a.enrollDeadline).getTime()) {
      return '<span class="faint">报名已截止（' + fmtShort(a.enrollDeadline) + '）</span>';
    }
    if (a.status !== 'PUBLISHED') return '<span class="faint">该活动尚未发布</span>';
    if (isFull(a)) return '<span class="full-mark">已满员 · 可候补</span>';
    return '剩余 <b>' + (a.capacity - confirmedOf(a.id)) + '</b> / ' + a.capacity + ' 个名额 <span class="ok-mark">可报名</span>';
  }

  /** 报名通道是否开放；满员**不算**被拒——满员是候补的入口（BR-3）。 */
  function enrollBlockReason(a) {
    if (a.status === 'OFFLINE') return '该活动已被管理员下线，暂不接受报名';
    if (a.status === 'CANCELED') return '该活动已取消';
    if (a.status === 'FINISHED') return '该活动已结束';
    if (a.status === 'ONGOING') return '活动已开始，报名通道已关闭';
    if (a.status !== 'PUBLISHED') return '该活动尚未发布';
    if (Date.now() >= new Date(a.enrollDeadline).getTime()) return '报名已截止';
    return '';
  }

  /** 距离「名单锁定」还有多少毫秒；已锁定则返回 0 或负数。 */
  function msUntilCancelLock(a) {
    return new Date(a.enrollDeadline).getTime() - CANCEL_LOCK_HOURS * 3600000 - Date.now();
  }

  /** 取消 / 退出 / 撤销能不能做；空串表示可以。 */
  function cancelBlockReason(a, m) {
    if (a.status === 'OFFLINE') return '该活动已被管理员下线，暂不能操作';
    if (a.status === 'CANCELED') return '活动已取消';
    if (a.status === 'FINISHED') return '活动已结束';
    if (m.status === 'PENDING' || m.status === 'WAITLISTED') return ''; // 不占名额，随时可撤 / 可退
    if (a.status === 'ONGOING') return '活动已开始，名单已锁定';
    if (a.status !== 'PUBLISHED') return '该活动尚未发布';
    if (m.checkInAt) return '你已签到，无法取消报名';
    if (Date.now() >= new Date(a.enrollDeadline).getTime()) return '报名已截止，名单已锁定';
    if (msUntilCancelLock(a) <= 0) {
      return '距报名截止不足 ' + CANCEL_LOCK_HOURS + ' 小时，名单已锁定';
    }
    return '';
  }

  /** 自动递补：名额空出时，队首逐位转正式（FR-4.5 / BR-6）。 */
  function promoteWaitlist(activityId) {
    const a = getAct(activityId);
    const promoted = [];
    if (!a || a.status !== 'PUBLISHED') return promoted;
    for (;;) {
      if (confirmedOf(activityId) >= a.capacity) break;
      const queue = waitlistOf(activityId);
      if (!queue.length) break;
      queue[0].status = 'CONFIRMED';
      promoted.push(queue[0]);
    }
    return promoted;
  }

  function statsOf(activityId) {
    const a = getAct(activityId);
    const enrolled = confirmedOf(activityId);
    const checked = checkedOf(activityId);
    return {
      enrolled: enrolled,
      checked: checked,
      absent: enrolled - checked,
      waitlisted: waitlistOf(activityId).length,
      pending: pendingOf(activityId).length,
      remaining: Math.max(a.capacity - enrolled, 0),
      rate: enrolled ? Math.round((checked / enrolled) * 1000) / 10 : 0,
      fill: a.capacity ? Math.round((enrolled / a.capacity) * 1000) / 10 : 0,
      capacity: a.capacity
    };
  }

  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    document.getElementById('toast-wrap').appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 240);
    }, 2200);
  }

  let modalOnOk = null;
  function openModal(opts) {
    modalOnOk = opts.onOk || null;
    const el = document.createElement('div');
    el.className = 'mask';
    el.innerHTML =
      '<div class="modal">' +
        '<div class="modal-h">' + esc(opts.title) + '</div>' +
        '<div class="modal-b">' +
          (opts.text ? '<div class="muted small" style="margin-bottom:10px">' + nl2br(opts.text) + '</div>' : '') +
          (opts.input
            ? '<textarea id="modal-input" placeholder="' + esc(opts.placeholder || '') + '"></textarea>'
            : '') +
        '</div>' +
        '<div class="modal-f">' +
          '<button class="btn" data-modal="cancel">取消</button>' +
          '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-modal="ok">' + esc(opts.okText || '确定') + '</button>' +
        '</div>' +
      '</div>';
    document.getElementById('modal-root').innerHTML = '';
    document.getElementById('modal-root').appendChild(el);
    const input = el.querySelector('#modal-input');
    if (input) input.focus();
    el.addEventListener('click', (e) => {
      const act = e.target.getAttribute && e.target.getAttribute('data-modal');
      if (act === 'cancel' || e.target === el) closeModal();
      else if (act === 'ok') {
        const val = input ? input.value.trim() : '';
        // 输入框默认必填；某些场景（如下线原因）允许留空，用 allowEmpty 放开
        if (input && !val && !opts.allowEmpty) { toast('请填写内容后再提交', 'warn'); return; }
        // 注意：必须先把回调取出来再 closeModal —— closeModal 会把 modalOnOk 置空，
        // 顺序反了会导致「确定」按钮静默失效。
        const cb = modalOnOk;
        closeModal();
        if (cb) cb(val);
      }
    });
  }
  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
    modalOnOk = null;
  }

  function exportCsv(filename, rows) {
    const csv = '\uFEFF' + rows.map((r) =>
      r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')
    ).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已导出 ' + filename, 'ok');
  }

          (a.requiresReview ? '需要审核，提交后进入待审核' : isFull(a) ? '活动已满员，将进入候补队列' : '') + '</div>';
    }

    // —— 从未报名 ——
    const reason = enrollBlockReason(a);
    if (reason) {
      return '<button class="btn primary" style="width:100%" disabled>' + esc(reason) + '</button>' +
        '<div class="hint" style="margin-top:10px;text-align:center">' +
          (isFull(a) && a.status === 'PUBLISHED' && Date.now() < new Date(a.enrollDeadline).getTime()
            ? '可关注后续是否有名额释放' : '') + '</div>';
    }
    if (a.requiresReview) {
      return '<button class="btn primary" style="width:100%" data-act="enroll" data-id="' + a.id + '">提交报名申请</button>' +
        '<div class="hint" style="margin-top:10px;text-align:center">该活动需组织教师审核；通过后按当时余位确定为「正式」或「候补」</div>';
    }
    if (isFull(a)) {
      return '<button class="btn warn" style="width:100%" data-act="enroll" data-id="' + a.id + '">加入候补队列</button>' +
        '<div class="hint" style="margin-top:10px;text-align:center">活动已满员，现在报名会进入候补，名额空出时<b>自动递补</b></div>';
    }
    return '<button class="btn primary" style="width:100%" data-act="enroll" data-id="' + a.id + '">立即报名</button>' +
      '<div class="hint" style="margin-top:10px;text-align:center">报名后可在「我的报名」中查看</div>';
  }

  function detailHtml() {
    const a = getAct(state.detailId);
    if (!a) return '<div class="empty"><div class="ei">❓</div>活动不存在</div>';

    const BACK = {
      plaza: '活动广场', my: '我的报名', 'teacher-activities': '我的活动',
      'admin-supervision': '活动监督'
    };
    const backPage = BACK[state.prevPage] ? state.prevPage : 'plaza';
    const mine = myEnroll(a.id);
    const confirmed = confirmedOf(a.id);
    const pct = Math.min(100, Math.round((confirmed / a.capacity) * 100));
    const cat = (CATEGORIES.find((c) => c.id === a.categoryId) || {}).name || '未分类';

    // 被下线的活动：学生不可见（但教师/管理员看得到，并带处理标记）
    const isOrganizerOrAdmin = state.user && (isMineAct(a) || state.user.role === 'ADMIN');
    if (a.status === 'OFFLINE' && !isOrganizerOrAdmin) {
      return '<div class="row" style="margin-bottom:14px">' +
        '<button class="btn ghost sm" data-act="nav" data-page="' + backPage + '">← 返回' + BACK[backPage] + '</button>' +
      '</div>' +
      '<div class="card"><div class="empty"><div class="ei">📴</div>该活动已被管理员下线，不再展示<br>' +
      '<span class="small">如有疑问请联系活动组织教师</span></div></div>';
    }

    let orgBox = '';
    if (isMineAct(a)) {
      orgBox = '<div class="callout" style="margin-top:16px">这是你负责的活动，可在左侧「我的活动」中管理；管理员的下线处理也会在这里显示。</div>';
    }

    return '' +
    '<div class="row" style="margin-bottom:14px">' +
      '<button class="btn ghost sm" data-act="nav" data-page="' + backPage + '">← 返回' + BACK[backPage] + '</button>' +
    '</div>' +
    '<div class="detail-hero t-' + toneOf(a.categoryId) + '">' +
      '<div class="dh-ico">' + a.emoji + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="row" style="margin-bottom:4px">' + badge(a.status) +
          (a.requiresReview ? '<span class="badge st-pending">需审核</span>' : '') +
          '<span class="badge st-draft">' + esc(cat) + '</span>' +
        '</div>' +
        '<h2 style="margin:0 0 4px;font-size:21px">' + esc(a.title) + '</h2>' +
        '<div class="muted small">组织教师：' + esc(orgName(a.organizerId)) + '</div>' +
      '</div>' +
    '</div>' +
    (a.status === 'OFFLINE'
      ? '<div class="callout danger" style="margin-bottom:16px"><b>该活动已被管理员下线</b>，学生端不再展示、不能报名。' +
        (a.offlineReason ? '<br>下线原因：' + esc(a.offlineReason) : '') +
        (a.offlineBy ? '<br><span class="small">处理人：' + esc(a.offlineBy) + '　' + fmtShort(a.offlineAt) + '</span>' : '') +
        '</div>'
      : '') +
    '<div class="detail-grid">' +
      '<div class="card card-pad">' +
        '<h3 style="margin:0 0 14px;font-size:15px">活动信息</h3>' +
        '<dl class="kv">' +
          '<dt>开始时间</dt><dd>' + fmt(a.startTime) + '</dd>' +
          '<dt>结束时间</dt><dd>' + fmt(a.endTime) + '</dd>' +
          '<dt>活动地点</dt><dd>' + esc(a.location) + '</dd>' +
          '<dt>报名截止</dt><dd>' + fmt(a.enrollDeadline) +
            ' <span class="small ' + (Date.now() >= new Date(a.enrollDeadline).getTime() ? 'faint' : 'muted') + '">（' + untilText(a.enrollDeadline) + '）</span></dd>' +

          '<dt>正式名额</dt><dd>' + confirmed + ' / ' + a.capacity + ' 人' +
            '<div class="progress" style="max-width:220px;margin-top:6px"><i style="width:' + pct + '%"></i></div></dd>' +
          '<dt>报名方式</dt><dd>' + (a.requiresReview
            ? '需组织教师审核；通过后按当时余位确定「正式」或「候补」'
            : '无需审核：有余位直接「正式」，满员自动进入「候补」') + '</dd>' +
          (a.qualification ? '<dt>参加资格</dt><dd>' + esc(a.qualification) + '</dd>' : '') +
        '</dl>' +
        '<div class="divider"></div>' +
        '<h3 style="margin:0 0 8px;font-size:15px">活动简介</h3>' +

        (waitlistOf(a.id).length
          ? '<div class="small" style="color:var(--warn);margin-bottom:2px">候补队列 ' + waitlistOf(a.id).length + ' 人</div>'
          : '') +

        detailActionHtml(a) +

  /* =========================================================
     10. 学生 —— 我的报名
     ========================================================= */
  function enrollStateText(a, m) {
    if (m.status === 'PENDING') return '<span class="badge st-pending">待审核</span>';
    if (m.status === 'WAITLISTED') return '<span class="badge st-waitlist">候补中 · 第 ' + waitlistPosition(m) + ' 位</span>';
    if (m.status === 'REJECTED') return '<span class="badge st-rejected">已拒绝</span>' + (m.reviewedAt ? ' <span class="small faint">' + fmtShort(m.reviewedAt) + '</span>' : '');
    if (m.status === 'CANCELED') return '<span class="badge st-canceled">已取消</span>';
    // 正式：再叠加签到状态
    if (m.checkInAt) return '<span class="badge st-ongoing">正式参加</span> <span class="badge st-ongoing">已签到</span>';
    if (a.status === 'FINISHED') return '<span class="badge st-ongoing">正式参加</span> <span class="badge st-rejected">缺席</span>';
    if (a.status === 'ONGOING') return '<span class="badge st-ongoing">正式参加</span> <span class="badge st-draft">待签到</span>';
    return '<span class="badge st-ongoing">正式参加</span> <span class="badge st-published">待参加</span>';
  }

  function actionLabelOf(status) {
    if (status === 'CONFIRMED') return '取消报名';
    if (status === 'WAITLISTED') return '退出候补';
    return '撤销申请';
  }

  function myEnrollmentsHtml() {
    const list = state.enrollments
      .filter((m) => m.isMe)
      .map((m) => ({ m: m, a: getAct(m.activityId) }))
      .filter((x) => x.a)
      .sort((x, y) => new Date(y.m.enrolledAt) - new Date(x.m.enrolledAt));

    if (!list.length) {
      return '<div class="page-head"><h2>我的报名</h2></div>' +
        '<div class="card"><div class="empty"><div class="ei">📭</div>还没有报名任何活动<br>' +
        '<span class="small">去「活动广场」看看吧</span></div></div>';
    }

    return '' +
    '<div class="page-head">' +
      '<h2>我的报名</h2>' +
      '<p>状态（待审核 / 正式 / 候补）、候补排位与取消规则都在这页 · 共 ' + list.length + ' 条记录</p>' +
    '</div>' +
    '<div class="callout" style="margin-bottom:16px">' +
      '<b>报名状态说明：</b>' +
      enrollBadge('CONFIRMED') + ' 已占名额；' +
      enrollBadge('WAITLISTED') + ' 不占名额、按进入候补的时间排队，名额空出时自动递补；' +
      enrollBadge('PENDING') + ' 等待教师确认，通过后按当时余位确定落位。' +
    '</div>' +
    '<div class="card tbl-wrap">' +
      '<table class="tb">' +
        '<thead><tr><th>活动</th><th>时间</th><th>地点</th><th>我的状态</th><th style="text-align:right">操作</th></tr></thead>' +
        '<tbody>' +
        list.map((x) => {
          const m = x.m;
          const isActive = ACTIVE_ENROLL.indexOf(m.status) !== -1;
          const block = isActive ? cancelBlockReason(x.a, m) : '该记录已结束';
          const canAct = isActive && !block;
          return '<tr>' +
            '<td><b>' + x.a.emoji + ' ' + esc(x.a.title) + '</b><div class="small faint">' + esc(orgName(x.a.organizerId)) + '</div></td>' +
            '<td class="muted small">' + fmtShort(x.a.startTime) + '</td>' +
            '<td class="muted small">' + esc(x.a.location) + '</td>' +
            '<td>' + enrollStateText(x.a, m) + '</td>' +
            '<td style="text-align:right">' +
              '<button class="btn sm" data-act="detail" data-id="' + x.a.id + '">查看</button> ' +
              (canAct
                ? '<button class="btn sm danger" data-act="unenroll" data-id="' + x.a.id + '">' + actionLabelOf(m.status) + '</button>'
                : !isActive
                  ? '<button class="btn sm" data-act="detail" data-id="' + x.a.id + '">重新报名</button>'
                  : '<span class="small faint">' + esc(block) + '</span>') +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="callout warn" style="margin-top:16px">' +
      '<b>取消规则：</b>「正式」报名的取消有名单锁定——距报名截止不足 ' + CANCEL_LOCK_HOURS + ' 小时起、活动开始后均不可取消；' +
      '「候补 / 待审核」不占名额，<b>随时可退可撤</b>。' +
    '</div>';
  }

  /* =========================================================
     11. 教师 —— 我的活动
     ========================================================= */
  function teacherActions(a) {
    const btns = [];
    if (a.status === 'DRAFT') {
      btns.push(['publish-activity', 'primary', '发布活动']);
      btns.push(['cancel-activity', 'danger', '取消']);
    }
    if (a.status === 'PUBLISHED') {
      btns.push(['goto-roster', '', '报名与签到']);
      btns.push(['goto-stats', '', '数据统计']);
      btns.push(['cancel-activity', 'danger', '取消活动']);
    }
    if (a.status === 'ONGOING') {
      btns.push(['goto-roster', 'primary', '报名与签到（签到中）']);
      btns.push(['goto-stats', '', '数据统计']);
      btns.push(['cancel-activity', 'danger', '取消活动']);
    }
    if (a.status === 'FINISHED') {
      btns.push(['goto-roster', '', '报名与签到']);
      btns.push(['goto-stats', '', '数据统计']);
    }
    if (a.status === 'OFFLINE' || a.status === 'CANCELED') {
      btns.push(['detail', '', '查看']);
    }
    return btns.map((b) =>
      '<button class="btn sm ' + b[1] + '" data-act="' + b[0] + '" data-id="' + a.id + '">' + b[2] + '</button>'
    ).join(' ');
  }

    const mine = state.activities
      .filter((a) => isMineAct(a))
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    const groups = ['DRAFT', 'PUBLISHED', 'ONGOING', 'FINISHED', 'OFFLINE', 'CANCELED'];

    groups.forEach((g) => { counts[g] = mine.filter((a) => a.status === g).length; });

    '<div class="page-head">' +

      '<p>' + esc(state.user.org || state.user.name) + ' 共负责 ' + mine.length + ' 个活动 · 创建后直接发布；管理员只在你违规时才会介入（下线 / 恢复）</p>' +
    '</div>' +
    '<div class="chips">' +
      groups.filter((g) => counts[g]).map((g) =>

          '<label>活动简介</label>' +

  function readForm() {
    const raw = {
      title: (document.getElementById('f-title') || {}).value || '',
      categoryId: (document.getElementById('f-category') || {}).value || 1,
      emoji: (document.getElementById('f-emoji') || {}).value || '🎉',
      description: (document.getElementById('f-desc') || {}).value || '',
      start: (document.getElementById('f-start') || {}).value || '',
      end: (document.getElementById('f-end') || {}).value || '',
      deadline: (document.getElementById('f-deadline') || {}).value || '',
      capacity: (document.getElementById('f-capacity') || {}).value || '',
      location: (document.getElementById('f-location') || {}).value || '',
      review: !!(document.getElementById('f-review') || {}).checked,
      qualification: (document.getElementById('f-qualification') || {}).value || ''
    };
    const capacity = Number(raw.capacity);

    if (!raw.title.trim()) return { error: '活动标题不能为空', raw: raw };
    if (raw.title.trim().length > 100) return { error: '活动标题不能超过 100 个字', raw: raw };
    if (!raw.location.trim()) return { error: '活动地点不能为空', raw: raw };
    if (!raw.start || !raw.end || !raw.deadline) return { error: '开始时间、结束时间和报名截止时间都必须填写', raw: raw };
    if (!capacity || capacity < 1) return { error: '人数上限必须是大于 0 的整数', raw: raw };
    if (new Date(raw.end) <= new Date(raw.start)) return { error: '结束时间必须晚于开始时间', raw: raw };
    if (new Date(raw.deadline) > new Date(raw.start)) return { error: '报名截止时间不能晚于活动开始时间', raw: raw };
    if (new Date(raw.end) <= new Date()) return { error: '结束时间必须晚于当前时间', raw: raw };
    // 勾了「需要审核」却没写资格说明：审的就是资格，学生也要先看到它
    if (raw.review && !raw.qualification.trim()) return { error: '勾选「需要审核」时，请填写参加资格说明', raw: raw };

    return {
      raw: raw,
      data: {
        title: raw.title.trim(),
        categoryId: Number(raw.categoryId),
        emoji: raw.emoji,
        description: raw.description.trim(),
        startTime: iso(new Date(raw.start)),
        endTime: iso(new Date(raw.end)),
        enrollDeadline: iso(new Date(raw.deadline)),
        capacity: capacity,
        location: raw.location.trim(),
        requiresReview: raw.review,
        qualification: raw.qualification.trim()
      }
    };
  }

  function createActivity(targetStatus) {
    const res = readForm();
    if (res.error) {
      // 保留用户填过的内容，只提示错在哪 —— 不要让人白填一遍
      state.formError = res.error;
      state.formDraft = res.raw;
      render();
      toast('请检查表单：' + res.error, 'err');
      return;
    }
    state.formError = '';
    state.formDraft = null;
    const d = res.data;
    const nextId = Math.max.apply(null, state.activities.map((a) => a.id)) + 1;
    const act = {
      id: nextId,
      title: d.title,
      emoji: d.emoji,
      categoryId: d.categoryId,
      organizerId: state.user.id,
      description: d.description || '（暂未填写活动简介）',
      startTime: d.startTime,
      endTime: d.endTime,
      enrollDeadline: d.enrollDeadline,
      location: d.location,
      capacity: d.capacity,
      requiresReview: d.requiresReview,
      qualification: d.qualification || null,
      status: targetStatus,
      checkInCode: null,
      seedEnrolled: 0,
      seedChecked: 0,
      createdAt: iso(new Date())
    };
    state.activities.unshift(act);

    if (targetStatus === 'PUBLISHED') {
      logAudit(nextId, 'PUBLISH');
      toast('已发布，学生端立即可见' + (d.requiresReview ? '（需审核报名）' : ''), 'ok');
    } else {
      toast('已存为草稿', 'ok');
    }
    state.page = 'teacher-activities';
    render();
  }

  function teacherStatsHtml() {

        '<thead><tr><th>学号 / 工号</th><th>姓名</th><th>角色</th><th>所属组织</th><th>状态</th><th style="text-align:right">操作</th></tr></thead>' +
        '<tbody>' +
        ALL_USERS.map((u) =>
          '<tr>' +
            '<td class="muted small">' + esc(u.studentNo) + '</td>' +
            '<td><b>' + esc(u.name) + '</b></td>' +
            '<td>' + roleBadge(u.role) + '</td>' +
            '<td class="muted small">' + esc(u.org || '—') + '</td>' +
            '<td>' + (u.status === 1
              ? '<span class="badge st-ongoing">正常</span>'
              : '<span class="badge st-canceled">已停用</span>') + '</td>' +
            '<td style="text-align:right">' +
              (u.role !== 'ADMIN'
                ? '<button class="btn sm ' + (u.status === 1 ? 'danger' : '') + '" data-act="toggle-user" data-no="' + esc(u.studentNo) + '">' +
                  (u.status === 1 ? '停用' : '恢复') + '</button>'
                : '<span class="faint small">—</span>') +
            '</td>' +
          '</tr>'
        ).join('') +
        '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="callout" style="margin-bottom:20px">' +
      '停用账号后该用户<b>无法登录</b>，但已有的报名记录不受影响（DEC-6）；问题处理完恢复为「正常」即可。' +
    '</div>' +
    '<div class="card card-pad" style="max-width:520px">' +
      '<h3 style="margin:0 0 12px;font-size:15px">活动分类</h3>' +
      CATEGORIES.map((c) =>
        '<div class="row" style="padding:8px 0;border-bottom:1px solid #f0f2f5">' +
          '<span>🏷️ ' + esc(c.name) + '</span><span class="spacer"></span>' +
          '<span class="small faint">' + state.activities.filter((a) => a.categoryId === c.id).length + ' 个活动</span>' +
        '</div>'
      ).join('') +
      '<div class="hint" style="margin-top:12px">Demo 中分类为只读展示；实际实现里支持增删改，删除前需校验是否仍被活动引用。</div>' +
    '</div>';
  }

  /* =========================================================
     17. 渲染入口
     ========================================================= */
  function render() {
    document.getElementById('app').innerHTML = state.user ? shellHtml() : loginHtml();
  }

  /* =========================================================
     18. 业务动作
     ========================================================= */
  const ACTIONS = {
    login: function (el) {
      state.user = LOGIN_USERS[el.getAttribute('data-role')];
      state.page = state.user.role === 'STUDENT' ? 'plaza'
                 : state.user.role === 'TEACHER' ? 'teacher-activities'
                 : 'admin-supervision';
      state.filter = { keyword: '', categoryId: '', status: '' };
      state.listPage = 1;
      state.formError = '';
      state.formDraft = null;
      render();
      toast('已以「' + state.user.name + '」身份进入', 'ok');
    },

    logout: function () {
      state.user = null;
      state.page = 'login';
      state.detailId = null;
      state.rosterId = null;
      state.formError = '';
      state.formDraft = null;
      state.guideOpen = false;
      render();
    },

    nav: function (el) {
      state.page = el.getAttribute('data-page');
      state.formError = '';
      state.formDraft = null;
      if (state.page === 'plaza' || state.page === 'admin-supervision') {
        state.filter = { keyword: '', categoryId: '', status: '' };
        state.listPage = 1;
      }
      render();
    },

    guide: function () { state.guideOpen = true; render(); },
    'guide-close': function () { state.guideOpen = false; render(); },

    detail: function (el) {
      if (state.page !== 'detail') state.prevPage = state.page;
      state.detailId = Number(el.getAttribute('data-id'));
      state.page = 'detail';
      render();
    },

    page: function (el) {
      const n = Number(el.getAttribute('data-n'));
      const pages = Math.ceil(filteredActivities().length / PAGE_SIZE) || 1;
      if (n < 1 || n > pages) return;
      state.listPage = n;
      render();
    },

    'filter-cat': function (el) {
      state.filter.categoryId = el.getAttribute('data-id');
      state.listPage = 1;
      refreshPlaza();
    },

    'filter-status-chip': function (el) {
      state.filter.status = el.getAttribute('data-s');
      render();
    },

    /* ---------- 学生：报名 / 取消 ---------- */

    enroll: function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      const reason = enrollBlockReason(a);
      if (reason) { toast(reason, 'err'); return; }

      let mine = myEnroll(a.id);
      if (mine && ACTIVE_ENROLL.indexOf(mine.status) !== -1) {
        toast('你已经报名过这个活动了（当前状态：' + ENROLL[mine.status].label + '）', 'warn');
        return;
      }

      const now = iso(new Date());
      if (!mine) {
        mine = {
          id: state.enrollments.length + 1,
          activityId: a.id,
          userId: state.user.id,
          studentNo: state.user.studentNo,
          name: state.user.name,
          isMe: true,
          status: 'CONFIRMED',
          enrolledAt: now,
          waitlistedAt: null,
          reviewedAt: null,
          reviewedBy: null,
          canceledAt: null,
          checkInAt: null
        };
        state.enrollments.push(mine);
      }
      // 复用旧记录（已取消 / 已拒绝）：时间线整体重置为「这一轮报名」
      mine.enrolledAt = now;
      mine.canceledAt = null;
      mine.reviewedAt = null;
      mine.reviewedBy = null;
      mine.checkInAt = null;
      mine.waitlistedAt = null;

      if (a.requiresReview) {
        mine.status = 'PENDING';
        render();
        toast('报名申请已提交，等待组织教师审核确认。', 'ok');
        return;
      }
      if (confirmedOf(a.id) < a.capacity) {
        mine.status = 'CONFIRMED';
        render();
        toast('报名成功，名额已为你保留。', 'ok');
        return;
      }
      mine.status = 'WAITLISTED';
      mine.waitlistedAt = now;
      render();
      toast('名额已满，已进入候补队列（当前第 ' + waitlistPosition(mine) + ' 位）。', 'ok');
    },

    unenroll: function (el) {
      const id = Number(el.getAttribute('data-id'));
      const a = getAct(id);
      const mine = myEnroll(id);
      if (!mine || ACTIVE_ENROLL.indexOf(mine.status) === -1) {
        toast('你还没有报名这个活动', 'err');
        return;
      }
      const block = cancelBlockReason(a, mine);
      if (block) { toast(block, 'err'); return; }

      const label = actionLabelOf(mine.status);
      const text = mine.status === 'CONFIRMED'
        ? '「' + a.title + '」的名额将立即释放，候补队列的队首会自动转为正式。'
        : mine.status === 'WAITLISTED'
          ? '退出候补后，你后面的候补者会按原顺序自动前移。'
          : '撤销后如需再参加，要重新提交申请。';
      openModal({
        title: '确认' + label + '？',
        text: text,
        okText: '确认' + label,
        danger: true,
        onOk: function () {
          const wasConfirmed = mine.status === 'CONFIRMED';
          mine.status = 'CANCELED';
          mine.canceledAt = iso(new Date());
          mine.waitlistedAt = null;
          const promoted = wasConfirmed ? promoteWaitlist(id) : [];
          render();
          if (promoted.length) {
            toast('已取消；候补第 1 位「' + promoted[0].name + '」已自动转正式', 'ok');
          } else {
            toast('已' + label, 'ok');
          }
        }
      });
    },

    /* ---------- 教师：活动与审核 ---------- */

    'publish-activity': function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      a.status = 'PUBLISHED';
      logAudit(a.id, 'PUBLISH');
      render();
      toast('活动已发布，学生端立即可见', 'ok');
    },

    'cancel-activity': function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      openModal({
        title: '确认取消活动？',
        text: '「' + a.title + '」已有 ' + confirmedOf(a.id) + ' 人正式报名、' + waitlistOf(a.id).length + ' 人候补。' +
              '取消后活动变为「已取消」，学生端只读。',
        okText: '确认取消活动',
        danger: true,
        onOk: function () {
          a.status = 'CANCELED';
          logAudit(a.id, 'CANCEL');
          render();
          toast('活动已取消', 'warn');
        }
      });
    },

    'save-draft': function () { createActivity('DRAFT'); },
    'publish-new': function () { createActivity('PUBLISHED'); },

    'open-checkin': function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      a.status = 'ONGOING';
      if (!a.checkInCode) a.checkInCode = String(Math.floor(100000 + Math.random() * 900000));
      render();
      toast('已开启签到，活动进入「进行中」，报名与取消通道同时关闭', 'ok');
    },

    'approve-enroll': function (el) {
      const eid = Number(el.getAttribute('data-id'));
      const row = state.enrollments.find((x) => x.id === eid);
      if (!row || row.status !== 'PENDING') { toast('这条申请已经处理过了', 'warn'); return; }
      const a = getAct(row.activityId);
      row.reviewedAt = iso(new Date());
      row.reviewedBy = state.user.id;
      if (confirmedOf(a.id) < a.capacity) {
        row.status = 'CONFIRMED';
        render();
        toast('已通过，' + row.name + ' 转为正式', 'ok');
      } else {
        // 通过 ≠ 一定参加：没有余位只能进候补，队列记录「通过时刻」
        row.status = 'WAITLISTED';
        row.waitlistedAt = iso(new Date());
        render();
        toast('已通过，但当前没有余位，' + row.name + ' 排进候补队列（第 ' + waitlistPosition(row) + ' 位）', 'warn');
      }
    },

    'reject-enroll': function (el) {
      const eid = Number(el.getAttribute('data-id'));
      const row = state.enrollments.find((x) => x.id === eid);
      if (!row || row.status !== 'PENDING') { toast('这条申请已经处理过了', 'warn'); return; }
      openModal({
        title: '拒绝这条申请？',
        text: '拒绝「' + row.name + '」对活动的报名申请。拒绝是终态：本次不能参加，也不会进入候补。',
        okText: '确认拒绝',
        danger: true,
        onOk: function () {
          row.status = 'REJECTED';
          row.reviewedAt = iso(new Date());
          row.reviewedBy = state.user.id;
          render();
          toast('已拒绝该申请', 'warn');
        }
      });
    },

    'toggle-checkin': function (el) {
      const eid = Number(el.getAttribute('data-id'));
      const row = state.enrollments.find((x) => x.id === eid);
      if (!row) return;
      if (row.checkInAt) {
        row.checkInAt = null;
        toast(row.name + ' 的签到已撤销', 'warn');
      } else {
        row.checkInAt = iso(new Date());
        toast(row.name + ' 已标记为签到', 'ok');
      }
      render();
    },

    'goto-roster': function (el) {
      state.rosterId = Number(el.getAttribute('data-id'));
      state.page = 'teacher-roster';
      render();
    },

    'goto-stats': function () {
      state.page = 'teacher-stats';
      render();
    },

    /* ---------- 导出 ---------- */

    export: function (el) {
      const id = Number(el.getAttribute('data-id'));
      const a = getAct(id);
      // 与真系统一致：导出「待审核 / 正式 / 候补」三类有效报名，用「状态」列区分；
      // 正式在前（要带去现场点名的就是这批人），候补严格按队列顺序。
      const order = { CONFIRMED: 0, PENDING: 1, WAITLISTED: 2 };
      const rows = state.enrollments
        .filter((e) => e.activityId === id && ACTIVE_ENROLL.indexOf(e.status) !== -1)
        .sort((x, y) => (order[x.status] - order[y.status]) || (x.id - y.id));
      const data = [['序号', '状态', '学号', '姓名', '报名时间', '签到状态', '签到时间']];
      rows.forEach((e, i) => {
        data.push([
          i + 1, ENROLL[e.status].label, e.studentNo, e.name,
          fmt(e.enrolledAt),
          e.checkInAt ? '已签到' : '未签到',
          e.checkInAt ? fmt(e.checkInAt) : ''
        ]);
      });
      exportCsv(a.title + '-报名名单.csv', data);
    },

    'export-stats': function () {
      const mine = state.activities.filter((a) => isMineAct(a))
        .filter((a) => ['PUBLISHED', 'ONGOING', 'FINISHED', 'CANCELED'].indexOf(a.status) !== -1);
      const data = [['活动名称', '状态', '开始时间', '正式人数', '人数上限', '候补人数', '实到人数', '签到率(%)', '上座率(%)']];
      mine.forEach((a) => {
        const s = statsOf(a.id);
        data.push([
          a.title, STATUS[a.status].label, fmt(a.startTime),
          s.enrolled, a.capacity, s.waitlisted, s.checked, s.rate, s.fill
        ]);
      });
      exportCsv('活动统计汇总.csv', data);
    },

    /* ---------- 管理员 ---------- */

    'admin-offline': function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      openModal({
        title: '下线活动',
        text: '下线「' + a.title + '」。学生端将不再展示、不能报名；教师端仍可见，并带上处理标记。\n（不删数据、不改内容、不动报名记录）',
        input: true,
        allowEmpty: true,
        placeholder: '下线原因（可选，会展示给组织教师）',
        okText: '确认下线',
        danger: true,
        onOk: function (reason) {
          a.status = 'OFFLINE';
          a.offlineReason = reason || '';
          a.offlineBy = state.user.name;
          a.offlineAt = iso(new Date());
          logAudit(a.id, 'OFFLINE', reason);
          render();
          toast('活动已下线，学生端不再展示', 'info');
        }
      });
    },

    'admin-restore': function (el) {
      const a = getAct(Number(el.getAttribute('data-id')));
      openModal({
        title: '恢复展示？',
        text: '恢复「' + a.title + '」的展示。恢复后会按时间重新定位状态（已发布 / 进行中 / 已结束）。',
        okText: '确认恢复',
        onOk: function () {
          a.status = statusByTime(a);
          logAudit(a.id, 'RESTORE');
          render();
          toast('已恢复展示（当前状态：' + STATUS[a.status].label + '）', 'ok');
        }
      });
    },

    'toggle-user': function (el) {
      const no = el.getAttribute('data-no');
      const u = ALL_USERS.find((x) => x.studentNo === no);
      if (!u) return;
      u.status = u.status === 1 ? 0 : 1;
      render();
      toast(u.name + ' 已' + (u.status === 1 ? '恢复' : '停用'), u.status === 1 ? 'ok' : 'warn');
    },

    'roster-pick': function () {}
  };

  /* =========================================================
     19. 事件绑定
     ========================================================= */
  document.addEventListener('click', function (e) {
    // 点击遮罩空白处：引导面板直接关闭，普通弹窗也关闭
    if (e.target.classList && e.target.classList.contains('mask')) {
      if (state.guideOpen) { state.guideOpen = false; render(); }
      else closeModal();
      return;
    }
    let el = e.target;
    while (el && el !== document.body) {
      const act = el.getAttribute && el.getAttribute('data-act');
      if (act && act !== 'search' && act !== 'filter-status' && act !== 'roster-pick') {
        e.preventDefault();
        const fn = ACTIONS[act];
        if (fn) fn(el, e);
        return;
      }
      el = el.parentElement;
    }
  });

  document.addEventListener('input', function (e) {
    const el = e.target;
    if (!el || el.getAttribute('data-act') !== 'search') return;
    state.filter.keyword = el.value;
    state.listPage = 1;
    refreshPlaza();
  });

  document.addEventListener('change', function (e) {
    const el = e.target;
    if (!el) return;
    const act = el.getAttribute('data-act');
    if (act === 'filter-status') {
      state.filter.status = el.value;
      state.listPage = 1;
      refreshPlaza();
    } else if (act === 'roster-pick') {
      state.rosterId = Number(el.value);
      render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* 启动 */
  render();
})();
</script>
</body>
</html>
