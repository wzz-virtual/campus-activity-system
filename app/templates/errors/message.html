{% extends "base.html" %}

{% block title %}{{ code }} · 校园活动管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <div class="display-6 fw-semibold text-secondary mb-2">{{ code }}</div>
        <p class="text-secondary mb-4">{{ message }}</p>
        <div class="d-flex gap-2 justify-content-center">
          <a class="btn btn-primary" href="{{ url_for('main.index') }}">回到首页</a>
          {% if not current_user.is_authenticated %}
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">去登录</a>
          {% endif %}
        </div>
        {% if code == 401 %}
          <p class="text-secondary small mt-4 mb-0">
            会话可能已过期。出于安全考虑，登录状态有有效期，超时后需要重新登录。
          </p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
