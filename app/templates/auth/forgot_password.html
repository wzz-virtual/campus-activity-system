{% extends "base.html" %}

{% block title %}忘记密码 · 校园活动管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-1">忘记密码</h1>
        <p class="text-secondary small mb-4">
          提交申请后，管理员会核实你的身份并重置密码。
        </p>

        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="student_no" class="form-label">学号 / 工号</label>
            <input type="text" class="form-control" id="student_no" name="student_no"
                   required autofocus>
          </div>

          <div class="mb-4">
            <label for="note" class="form-label">
              核实信息 <span class="text-secondary fw-normal">（选填）</span>
            </label>
            <textarea class="form-control" id="note" name="note" rows="3"
                      placeholder="院系班级、手机号尾号等，便于管理员确认是你本人"></textarea>
            <div class="form-text">
              填得越具体，管理员核实越快。
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">提交申请</button>
        </form>

        <div class="mt-3 text-center">
          <a class="small" href="{{ url_for('auth.login') }}">返回登录</a>
        </div>
      </div>
    </div>

    <p class="text-secondary small text-center mt-3 mb-0">
      为保护账号安全，无论学号是否存在，本页都会给出相同提示。
    </p>
  </div>
</div>
{% endblock %}
